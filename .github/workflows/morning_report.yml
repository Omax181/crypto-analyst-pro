name: Morning Crypto Report

# Un seul déclencheur planifié : cron-job.org via repository_dispatch. Le
# schedule GitHub natif reste retiré (deux déclencheurs = mails en double).
on:
  repository_dispatch:
    types: [morning, morning-report, morning_report, run-morning, run_morning]
  workflow_dispatch:

concurrency:
  group: morning-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Doit rester >= au budget LLM de src/ai_brain/llm.py (900 s) + collecte.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run morning report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # V31 (I55) — un repli identique au primaire n'est pas un repli : le
          # code le détecte au démarrage et le déclare dans le bandeau.
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m src.main morning
      # V31 (I53) — le commit d'état est conditionné au SUCCÈS du run. En v30,
      # « if: always() » persistait le carnet même quand le mail n'était pas
      # parti : des contrats existaient sans avoir jamais été communiqués.
      - name: Commit state files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement de state à committer."
            exit 0
          fi
          git commit -m "chore: update state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push && { echo "State poussé."; break; }
            echo "Push tentative $i échouée, nouvelle tentative dans 5s…"
            sleep 5
          done
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-morning
          path: logs/
